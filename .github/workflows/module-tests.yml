name: Module Tests

on:
  pull_request:
    paths:
      - 'examples/modules/**'
  push:
    branches: [main]
    paths:
      - 'examples/modules/**'

permissions:
  contents: read

jobs:
  test-modules:
    name: Test ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: [api-health, ssl-monitor, statuspage-complete]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Build provider
        run: go build -o terraform-provider-hyperping

      - name: Configure provider dev override
        run: |
          cat > ~/.terraformrc << EOF
          provider_installation {
            dev_overrides {
              "hyperping/hyperping" = "${{ github.workspace }}"
            }
            direct {}
          }
          EOF

      - name: Validate module
        working-directory: examples/modules/${{ matrix.module }}
        run: terraform validate

      - name: Run module tests
        working-directory: examples/modules/${{ matrix.module }}
        run: terraform test

  summary:
    name: Module Tests Summary
    runs-on: ubuntu-latest
    needs: test-modules
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test-modules.result }}" == "success" ]; then
            echo "✅ All module tests passed"
          else
            echo "❌ Some module tests failed"
            exit 1
          fi
